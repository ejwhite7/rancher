coverage:
  paths: [coverage/quiz/lcov.info]
  fail_under: 90
  fail_under_branches: 80
  min_coverable_lines: 0
  gates:
    - name: seller-quiz
      paths:
        - /src/components/QuizFunnel.tsx
        - /src/components/useQuiz*.ts
        - /src/lib/quiz*.ts
        - /src/server/quiz*.ts
        - /src/pages/api/quiz/
        - /scripts/quiz-browser-coverage.mjs
      fail_under: 90

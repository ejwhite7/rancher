<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650"><rect width="1000" height="650" fill="#f7f6ee"/><text x="50" y="65" font-size="32" font-family="Georgia" fill="#193e34">A proposed licensing decision sequence</text><rect x="50" y="105" width="900" height="70" rx="4" fill="#fffef7" stroke="#d9dfd3"/><text x="80" y="150" font-family="Arial" font-size="25" fill="#193e34">1. Inventory metadata</text><rect x="50" y="205" width="900" height="70" rx="4" fill="#fffef7" stroke="#d9dfd3"/><text x="80" y="250" font-family="Arial" font-size="25" fill="#193e34">2. Review authority</text><rect x="50" y="305" width="900" height="70" rx="4" fill="#fffef7" stroke="#d9dfd3"/><text x="80" y="350" font-family="Arial" font-size="25" fill="#193e34">3. Scope and assess risk</text><rect x="50" y="405" width="900" height="70" rx="4" fill="#fffef7" stroke="#d9dfd3"/><text x="80" y="450" font-family="Arial" font-size="25" fill="#193e34">4. Evaluate utility</text><rect x="50" y="505" width="900" height="70" rx="4" fill="#fffef7" stroke="#d9dfd3"/><text x="80" y="550" font-family="Arial" font-size="25" fill="#193e34">5. Agree written terms</text></svg>